escenario_id: c2-baja-confianza
descripcion: >-
  C2 baja confianza. La misma escena de S5 con poca luz y desenfoque (Gaussian blur radio
  3 y brillo x0.30, aplicado a la imagen; ver datos/preparadas/poca-luz), a 2 fps, con el
  mismo modelo, preprocesamiento y umbrales que C1.
esperado: >-
  Las puntuaciones reales del modelo caen bajo el umbral inferior (0.40) en la mayoria de
  los frames de la primera ventana: baja-confianza-v1 se abre con los eventos de zona baja
  y sus capturas. Con la segunda ventana (frames 7-12, la escena mas iluminada) la
  proporcion baja de 0.50 y la alerta se resuelve.
segmentos:
  - manifiesto: datos/preparadas/poca-luz/capturas.csv
