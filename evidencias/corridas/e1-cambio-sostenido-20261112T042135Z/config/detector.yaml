# Runtime del detector (mismo formato que P5 config/detector.yaml). Lo lee
# `p6.detector_onnx.cargar_config`, que rechaza claves desconocidas y valores fuera de rango.
# Rutas relativas a este archivo.
version: 1

modelo: ../modelo/yolox_nano.onnx        # se descarga con scripts/descargar_modelo.py
descriptor: ../modelo/descriptor.yaml    # SHA-256 esperado y lista de 80 clases COCO

preprocesamiento:
  tamano_entrada: 416   # lado del tensor cuadrado de YOLOX-Nano
  relleno: 114          # gris del letterbox, como en el entrenamiento de YOLOX

posprocesamiento:
  # Piso de salida. Debe quedar por debajo del umbral inferior de la politica
  # (config/monitoreo.yaml) para que la zona de baja confianza sea observable; en P5 era
  # 0.30. Por debajo de 0.10 la salida es casi solo ruido de fondo (ver docs/umbrales.md).
  umbral_confianza: 0.10
  nms_iou: 0.45           # NMS por clase; valor por defecto de YOLOX
  max_detecciones: 100    # tope por cuadro despues del NMS, ordenadas por puntuacion
