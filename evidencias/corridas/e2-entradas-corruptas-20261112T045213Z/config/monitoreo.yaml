# Configuracion del monitoreo (P6). La lee `p6.config.cargar`, que rechaza claves
# desconocidas y valores fuera de rango. Rutas relativas a este archivo.
# Fijada antes de ejecutar C1/C2: todas las corridas de evidencias usan este mismo archivo
# (su SHA-256 queda en run.json y en cada evento como `config_ref`).
version: 1
config_id: monitoreo-v1

fuente:
  source_id: carrito-esp32cam   # camara del carrito del Proyecto 5 (secuencias capturadas)
  fps: 2.0                      # ritmo de reproduccion: un frame cada 0.5 s
  cola_max: 8                   # frames en espera; si se llena se descarta el mas antiguo
  limite_sin_frames_s: 3.0      # sin frames nuevos por mas de esto => fuente detenida

detector: detector.yaml          # modelo, preprocesamiento, piso de salida y NMS

politica:
  # Zonas por puntuacion s (frame: maxima puntuacion entre sus candidatas):
  #   s >= superior          -> aceptada (por politica; no afirma acierto)
  #   inferior <= s < sup.   -> duda
  #   s < inferior           -> baja
  # Frames sin detecciones y fallos son estados aparte (sin zona ni puntuacion).
  # Justificacion con la corrida de referencia en docs/umbrales.md.
  umbral_inferior: 0.40
  umbral_superior: 0.70

ventanas:
  tamano_frames: 6        # ventanas consecutivas sin traslape de 6 frames procesados (3 s)
  minimo_puntuados: 4     # menos frames con puntuacion => evidencia insuficiente

referencia: referencia.json      # congelada desde la corrida de referencia (p6.referencia)

reglas:
  baja_confianza:
    rule_id: baja-confianza-v1
    proporcion_minima: 0.50     # p_baja de la ventana >= 0.50
    severidad: advertencia
    accion: >-
      Revisar las capturas de la ventana: iluminacion, enfoque y obstrucciones de la camara.
      Confirmar que el preprocesamiento y el modelo son los esperados.
  cambio_sostenido:
    rule_id: cambio-sostenido-v1
    tolerancia: 0.30            # p_baja de la ventana > p_baja_referencia + 0.30
    ventanas_consecutivas: 3    # durante 3 ventanas suficientes seguidas
    severidad: alta
    accion: >-
      Posible cambio de condiciones respecto de la referencia. Comparar capturas actuales con
      las de referencia y decidir si la escena cambio; la confianza no confirma drift.
  errores_inferencia:
    rule_id: errores-inferencia-v1
    proporcion_minima: 0.50     # frames con status=error entre intentos de la ventana
    minimo_intentos: 3
    severidad: alta
    accion: Revisar los archivos de entrada marcados como error y el log del detector.
  fuente_detenida:
    rule_id: fuente-detenida-v1
    severidad: alta
    accion: Verificar la conexion de la camara o la reproduccion de la secuencia.

captura:
  # Que imagenes se conservan (copias en la carpeta de la corrida, sin expiracion):
  zonas: [baja, duda]       # todo frame cuya zona sea una de estas
  errores: true             # los bytes de la entrada que fallo, tal cual
  alertas: true             # todo frame referenciado por una alerta
  muestra_normal_cada: 4    # 1 de cada 4 frames aceptados o sin detecciones
