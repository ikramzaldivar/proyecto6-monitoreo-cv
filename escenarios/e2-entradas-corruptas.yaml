escenario_id: e2-entradas-corruptas
descripcion: >-
  Extra E2, error de inferencia por entradas corruptas. 6 frames validos de S5, luego 5
  archivos ilegibles (4 JPEG truncados y 1 vacio, datos/preparadas/corruptas) y despues S5
  original otra vez. 2 fps.
esperado: >-
  Los 5 archivos ilegibles quedan como status=error con el mensaje del decodificador, sin
  puntuacion ni zona y con sus bytes conservados. La ventana que los contiene cumple
  errores-inferencia-v1 (>= 50 % de errores con >= 3 intentos) y abre la alerta. Al volver
  los frames validos, la siguiente ventana no cumple y la alerta se resuelve.
segmentos:
  - manifiesto: datos/carrito/capturas.csv
    secuencias: [S5]
  - manifiesto: datos/preparadas/corruptas/capturas.csv
  - manifiesto: datos/carrito/capturas.csv
    secuencias: [S5]
